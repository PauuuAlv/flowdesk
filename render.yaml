databases:
  - name: flowdesk-preview-db
    plan: free
    region: ohio
    databaseName: flowdesk
    user: flowdesk
    postgresMajorVersion: "16"

services:
  - type: web
    name: flowdesk-preview-api
    runtime: docker
    plan: free
    region: ohio
    branch: preview/fullstack
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: SQLALCHEMY_DATABASE_URL
        fromDatabase:
          name: flowdesk-preview-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
