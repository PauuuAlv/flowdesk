databases:
  - name: flowdesk-preview-db
    plan: free
    region: ohio
    databaseName: flowdesk
    user: flowdesk
    postgresMajorVersion: "16"

services:
  - type: web
    name: flowdesk-preview-api
    runtime: docker
    plan: free
    region: ohio
    branch: preview/fullstack
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: SQLALCHEMY_DATABASE_URL
        fromDatabase:
          name: flowdesk-preview-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Flowdesk
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_API_URL
        value: https://api.resend.com/emails
