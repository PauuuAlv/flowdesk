services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowdesk}
      POSTGRES_USER: ${POSTGRES_USER:-flowdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowdesk-local-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flowdesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowdesk} -d ${POSTGRES_DB:-flowdesk}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowdesk}:${POSTGRES_PASSWORD:-flowdesk-local-password}@postgres:5432/${POSTGRES_DB:-flowdesk}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-local-development}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - flowdesk_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend/app:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "4200:4200"
    networks:
      - flowdesk_network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  flowdesk_network:
    driver: bridge
