server {
    listen 80;

    # FastAPI: Nginx elimina el prefijo /api antes de reenviar la solicitud.
    # sin quitar el prefijo (por eso proxy_pass termina en /api/, no en /).
    # Así, cualquier endpoint nuevo que agreguen bajo /api/... en FastAPI
    # funciona automáticamente, sin tener que tocar este archivo de nuevo.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Endpoints de infraestructura (no son "negocio", quedan fuera de /api)
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
    
    # Documentación de FastAPI disponible en desarrollo.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Angular dev server y WebSocket para recarga automática.
    location / {
        proxy_pass http://frontend:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
