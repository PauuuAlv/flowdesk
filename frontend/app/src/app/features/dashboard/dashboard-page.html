<main class="dashboard-page">
  <section class="welcome-card" aria-labelledby="dashboard-title">
    <p class="eyebrow">Sesión protegida</p>
    <h1 id="dashboard-title">Bienvenido{{ user?.full_name ? ', ' + user?.full_name : '' }}</h1>
    <p>Este es el inicio de tu espacio de trabajo en Flowdesk.</p>

    <dl>
      <div><dt>Correo</dt><dd>{{ user?.email }}</dd></div>
      <div><dt>Empresa</dt><dd>{{ user?.tenant_name || 'Mi empresa' }}</dd></div>
      <div><dt>Rol</dt><dd>{{ user?.role }}</dd></div>
    </dl>

    @if (user?.role === 'admin') {
      <a class="primary-link" routerLink="/panel/usuarios/invitar">Invitar usuarios de mi empresa</a>
    }
  </section>
</main>
