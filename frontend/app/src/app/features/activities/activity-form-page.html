<section class="module"><header><div><p class="eyebrow">Seguimiento comercial</p><h1>{{id?'Editar actividad':'Nueva actividad'}}</h1><p>Programa el próximo contacto y mantenlo relacionado con el cliente correcto.</p></div><a routerLink="/panel/actividades">Volver</a></header>@if(error()){<p class="error" role="alert">{{error()}}</p>}@if(loading()){<div class="card">Cargando…</div>}@else{<form [formGroup]="form" (ngSubmit)="submit()"><div class="card grid"><label>Tipo *<select formControlName="activity_type"><option value="call">Llamada</option><option value="email">Correo</option><option value="meeting">Reunión</option><option value="task">Tarea</option></select></label><label>Fecha y hora *<input type="datetime-local" formControlName="scheduled_at"></label><label>Cliente *<select formControlName="client_id"><option value="">Selecciona un cliente</option>@for(client of clients();track client.id){<option [value]="client.id">{{client.company_name}}</option>}</select></label><label>Oportunidad relacionada<select formControlName="opportunity_id"><option value="">Sin oportunidad</option>@for(opportunity of availableOpportunities();track opportunity.id){<option [value]="opportunity.id">{{opportunity.name}}</option>}</select></label><label class="wide">Título *<input formControlName="title" placeholder="Ej: Llamada para revisar propuesta"></label><label>Responsable *<select formControlName="owner_user_id">@for(user of assignees();track user.id){<option [value]="user.id">{{user.name}}</option>}</select></label><label class="wide">Descripción<textarea rows="5" maxlength="1000" formControlName="description" placeholder="Agrega acuerdos, objetivo o información útil"></textarea></label></div><div class="actions"><a routerLink="/panel/actividades">Cancelar</a><button [disabled]="saving()">{{saving()?'Guardando…':'Guardar actividad'}}</button></div></form>}</section>
