<section class="module">
  <header>
    <div>
      <p class="eyebrow">Seguimiento comercial</p>
      <h1>{{ id ? 'Editar actividad' : 'Nueva actividad' }}</h1>
      <p>Programa el próximo contacto y mantenlo relacionado con el cliente correcto.</p>
    </div>
    <a routerLink="/panel/actividades">Volver</a>
  </header>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  @if (loading()) {
    <div class="card">Cargando…</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="card grid">
        <label
          >Tipo *<app-combobox formControlName="activity_type" [options]="typeOptions" placeholder="Selecciona un tipo"
          /></label
        ><label>Fecha y hora *<input type="datetime-local" formControlName="scheduled_at" /></label
        ><label
          >Cliente *<app-combobox
            formControlName="client_id"
            [options]="clientOptions()"
            placeholder="Escribe para buscar un cliente"
        /></label
        ><label
          >Oportunidad relacionada<app-combobox
            formControlName="opportunity_id"
            [options]="opportunityOptions()"
            placeholder="Sin oportunidad"
        /></label
        ><label class="wide"
          >Título *<input
            formControlName="title"
            placeholder="Ej: Llamada para revisar propuesta" /></label
        ><label
          >Responsable *<app-combobox
            formControlName="owner_user_id"
            [options]="assigneeOptions()"
            placeholder="Escribe para buscar un responsable"
        /></label
        ><label class="wide"
          >Descripción<textarea
            rows="5"
            maxlength="1000"
            formControlName="description"
            placeholder="Agrega acuerdos, objetivo o información útil"
          ></textarea>
        </label>
      </div>
      <div class="actions">
        <a routerLink="/panel/actividades">Cancelar</a
        ><button [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Guardar actividad' }}</button>
      </div>
    </form>
  }
</section>
