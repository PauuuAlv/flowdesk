<section class="module-page"><header><div><p class="eyebrow">Pipeline comercial</p><h1>{{id?'Editar oportunidad':'Nueva oportunidad'}}</h1><p>Define el valor, responsable y siguiente etapa de la negociación.</p></div><a routerLink="/panel/oportunidades">Volver</a></header>
@if(error()){<p class="error">{{error()}}</p>}@if(loading()){<div class="card">Cargando…</div>}@else{<form [formGroup]="form" (ngSubmit)="submit()"><div class="card grid">
<label><span>Cliente *</span><select formControlName="client_id"><option value="">Selecciona un cliente</option>@for(c of clients();track c.id){<option [value]="c.id">{{c.company_name}}</option>}</select></label>
<label><span>Nombre *</span><input formControlName="name" placeholder="Ej: Renovación anual"></label><label><span>Responsable *</span><select formControlName="owner_user_id">@for(u of assignees();track u.id){<option [value]="u.id">{{u.name}}</option>}</select></label>
<label><span>Valor estimado *</span><input type="number" min="0" step="0.01" formControlName="amount"></label><label><span>Etapa *</span><select formControlName="stage">@for(s of stages;track s[0]){<option [value]="s[0]">{{s[1]}}</option>}</select></label><label><span>Probabilidad (%) *</span><input type="number" min="0" max="100" formControlName="probability"></label><label><span>Fecha estimada de cierre</span><input type="date" formControlName="expected_close_date"></label><label class="wide"><span>Notas</span><textarea rows="5" formControlName="notes" maxlength="1000"></textarea></label></div><div class="actions"><a routerLink="/panel/oportunidades">Cancelar</a><button [disabled]="saving()">{{saving()?'Guardando…':'Guardar oportunidad'}}</button></div></form>}</section>
