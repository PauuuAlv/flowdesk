<div class="control" [title]="summary()">
  <input
    #field
    class="field"
    type="text"
    role="combobox"
    autocomplete="off"
    spellcheck="false"
    aria-autocomplete="list"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="open() && filtered().length ? optionId(active()) : null"
    [placeholder]="fieldPlaceholder()"
    [value]="text()"
    (focus)="openList()"
    (click)="openList()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
  @if (selected().length > 1) {
    <span class="count" aria-hidden="true">{{ selected().length }}</span>
  }
  <button
    class="chevron"
    type="button"
    tabindex="-1"
    aria-hidden="true"
    (mousedown)="$event.preventDefault()"
    (click)="toggleFromChevron()"
  >
    <svg viewBox="0 0 20 20"><path d="m5 7.5 5 5 5-5" /></svg>
  </button>
</div>

@if (open()) {
  <div class="panel" (mousedown)="$event.preventDefault()">
    <div class="actions">
      <button type="button" tabindex="-1" (click)="selectAllVisible()">
        {{ query() ? 'Seleccionar coincidencias' : 'Seleccionar todos' }}
      </button>
      <button type="button" tabindex="-1" [disabled]="!selected().length" (click)="clear()">Limpiar</button>
    </div>
    <ul role="listbox" aria-multiselectable="true" [id]="listId">
      @for (option of filtered(); track option.value; let i = $index) {
        <li
          role="option"
          [id]="optionId(i)"
          [class.active]="i === active()"
          [attr.aria-selected]="selectedSet().has(option.value)"
          (mouseenter)="active.set(i)"
          (click)="toggleOption(option.value)"
        >
          <span class="check" [class.on]="selectedSet().has(option.value)" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7" /></svg>
          </span>
          <span class="label">{{ option.label }}</span>
          @if (option.hint) {
            <small>{{ option.hint }}</small>
          }
        </li>
      } @empty {
        <li class="empty" role="presentation">Sin coincidencias</li>
      }
    </ul>
  </div>
}
