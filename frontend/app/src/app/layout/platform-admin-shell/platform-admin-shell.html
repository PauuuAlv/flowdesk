<div class="app-shell">
  <aside class="sidebar" [class.is-open]="sidebarOpen()" aria-label="Navegación de administración">
    <div class="sidebar-heading">
      <a class="brand" routerLink="/administracion-flowdesk" (click)="closeSidebar()">Flowdesk</a>
      <button class="sidebar-close" type="button" (click)="closeSidebar()" aria-label="Cerrar menú">×</button>
    </div>

    <nav>
      <p class="nav-label">Administración</p>
      <a routerLink="/administracion-flowdesk/empresas" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
        <span class="nav-icon" aria-hidden="true">▦</span>
        Empresas
      </a>
      <a routerLink="/administracion-flowdesk/empresas/nueva" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon" aria-hidden="true">＋</span>
        Crear empresa
      </a>
    </nav>

    <div class="sidebar-footer">
      <span>Ámbito</span>
      <strong>Plataforma Flowdesk</strong>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <button class="backdrop" type="button" (click)="closeSidebar()" aria-label="Cerrar menú"></button>
  }

  <section class="workspace">
    <header class="topbar">
      <div class="topbar-company">
        <button class="menu-button" type="button" (click)="toggleSidebar()" aria-label="Abrir menú" [attr.aria-expanded]="sidebarOpen()">☰</button>
        <div>
          <span>Panel</span>
          <strong>Administración de plataforma</strong>
        </div>
      </div>

      <div class="profile-area">
        <button class="profile-trigger" type="button" (click)="toggleProfile()" [attr.aria-expanded]="profileOpen()" aria-haspopup="menu">
          <span class="avatar" aria-hidden="true">{{ initials }}</span>
          <span class="profile-copy">
            <strong>{{ email || 'Superadministrador' }}</strong>
            <small>Superadministrador</small>
          </span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        @if (profileOpen()) {
          <div class="profile-menu" role="menu">
            <div class="profile-summary">
              <strong>Superadministrador</strong>
              <span>{{ email }}</span>
            </div>
            <button role="menuitem" type="button" (click)="logout()">Cerrar sesión</button>
          </div>
        }
      </div>
    </header>

    <main class="page-content" (click)="closeProfile()">
      <router-outlet />
    </main>
  </section>
</div>
